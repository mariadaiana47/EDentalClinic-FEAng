<div class="shell">
  <div class="app-wrapper">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
          <path
            d="M8 0C5.373 0 4 2.314 4 4c0 .991-.722 3.696-1.84 5.504-.485.784-.91 1.497-1.11 2.35-.165.71-.163 1.51.63 2.05.75.51 1.908.414 2.926-.296.435-.305.92-.48 1.394-.48s.96.175 1.394.48c1.018.71 2.176.806 2.926.296.793-.54.795-1.34.63-2.05-.2-.853-.625-1.566-1.11-2.35C10.722 7.696 10 4.991 10 4c0-1.686-1.373-4-2-4zm0 1c.28 0 1 1.373 1 3 0 1.18.832 4.073 1.91 5.814.455.736.795 1.315.955 2.003.123.528.058.78-.123.903-.393.268-1.168.158-1.91-.35C9.22 11.945 8.61 11.72 8 11.72s-1.22.225-1.832.65c-.742.508-1.517.618-1.91.35-.18-.123-.246-.375-.123-.903.16-.688.5-1.267.955-2.003C6.168 8.073 7 5.18 7 4c0-1.627.72-3 1-3z" />
        </svg>
        <span class="brand-name">EDentalClinic</span>
      </div>

      <nav class="sidebar-nav">

        <ng-container *ngIf="role() === 'ASSISTANT'">
          <a routerLink="/assistant" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
            <i class="bi bi-grid-1x2"></i><span>Dashboard</span>
          </a>
          <a routerLink="/assistant/register-patient" routerLinkActive="active">
            <i class="bi bi-person-plus"></i><span>Înregistrare Pacient</span>
          </a>
        </ng-container>

        <ng-container *ngIf="role() === 'DOCTOR'">
          <a routerLink="/doctor" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
            <i class="bi bi-grid-1x2"></i><span>Dashboard</span>
          </a>
          <a routerLink="/doctor/search" routerLinkActive="active">
            <i class="bi bi-search"></i><span>Căutare Pacient</span>
          </a>
          <a routerLink="/doctor/patients" routerLinkActive="active">
            <i class="bi bi-people"></i><span>Pacienții Mei</span>
          </a>
          <a routerLink="/doctor/radiologists" routerLinkActive="active">
            <i class="bi bi-broadcast-pin"></i><span>Radiologi Afiliați</span>
          </a>
        </ng-container>

        <ng-container *ngIf="role() === 'PATIENT'">
          <a routerLink="/patient" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
            <i class="bi bi-folder2-open"></i><span>Dosarul Meu</span>
          </a>
          <a routerLink="/patient/scheduling" routerLinkActive="active">
            <i class="bi bi-calendar-plus"></i><span>Programare Radiografie</span>
          </a>
        </ng-container>

        <ng-container *ngIf="role() === 'RADIOLOGIST'">
          <a routerLink="/radiologist" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
            <i class="bi bi-grid-1x2"></i><span>Dashboard</span>
          </a>
        </ng-container>

      </nav>

      <div class="sidebar-footer">
        <div class="user-row">
          <div class="user-avatar">{{ email()?.[0]?.toUpperCase() }}</div>
          <div class="user-info">
            <div class="user-email">{{ email() }}</div>
            <div class="user-role">{{ role() }}</div>
          </div>
        </div>
        <button class="logout-btn" (click)="logout()">
          <i class="bi bi-box-arrow-right"></i> Logout
        </button>
      </div>
    </aside>

    <div class="main-col">
      <header class="top-header">
      </header>

      <div class="content-area">
        <router-outlet></router-outlet>
      </div>
    </div>

  </div>
</div>
