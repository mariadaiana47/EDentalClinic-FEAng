<div class="login-page">
  <div class="login-bg"></div>
  <div class="login-overlay"></div>

  <div class="login-card">
    <div class="login-brand">
      <svg class="login-tooth-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#2aa8bf" width="28" height="28">
        <path d="M19 3c-1.3 0-2.5.5-3.4 1.4C14.7 3.5 13.4 3 12 3s-2.7.5-3.6 1.4C7.5 3.5 6.3 3 5 3 3.3 3 2 4.3 2 6c0 1.5.9 2.8 2.2 3.2L5.5 20c.2.6.7 1 1.3 1 .5 0 1-.3 1.2-.8L9.5 16l1.5 4.2c.2.5.7.8 1.2.8h.6c.5 0 1-.3 1.2-.8L15.5 16l1.5 4.2c.2.5.7.8 1.2.8.6 0 1.1-.4 1.3-1l1.3-10.8C21.1 8.8 22 7.5 22 6c0-1.7-1.3-3-3-3z"/>
      </svg>
      <span>EDentalClinic</span>
    </div>
    <p class="login-sub">Autentificare in contul tau</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" autocomplete="off">
      <div class="field-group">
        <label>Email</label>
        <input type="email" name="email" [(ngModel)]="email" placeholder="email@exemplu.ro" autocomplete="username"
          required />
      </div>

      <div class="field-group">
        <label>Parola</label>
        <input type="password" name="password" [(ngModel)]="password" placeholder="••••••••"
          autocomplete="current-password" required />
      </div>

      @if (errorMessage()) {
      <div class="error-msg">{{ errorMessage() }}</div>
      }

      <button type="submit" class="login-btn" [disabled]="loading()">
        <span *ngIf="!loading()">Autentificare</span>
        <span *ngIf="loading()" class="d-flex align-items-center justify-content-center gap-2">
          <span class="spinner-border spinner-border-sm"></span> Se autentifica...
        </span>
      </button>
    </form>
  </div>
</div>
